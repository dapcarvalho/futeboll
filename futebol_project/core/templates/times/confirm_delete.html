{% extends 'base.html' %}

{% block content %}
<div style="max-width:500px; margin:auto; text-align:center;">

    <h2>Confirmar Exclusão</h2>

    <p>Tem certeza que deseja excluir o time:</p>

    <p>
        <strong>{{ time.nome }}</strong><br>
        {{ time.cidade }}
    </p>

    <form method="post"
          onsubmit="return confirm('Deseja excluir o time {{ time.nome }}?');">
        {% csrf_token %}
        <button type="submit" style="
            background:red;
            color:white;
            padding:10px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;">
            Excluir
        </button>
    </form>

    <br>

    <a href="/times/" style="
        display:inline-block;
        margin-top:10px;
        text-decoration:none;
        color:#333;">
        Cancelar
    </a>

</div>
{% endblock %}
